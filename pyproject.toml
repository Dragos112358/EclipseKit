[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eclipsekit"
version = "0.1.0a1"
description = "A modular Python engine for solar- and lunar-eclipse circumstances"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [{ name = "Boncan Dragos-Eduard-Gabriel" }]
keywords = ["astronomy", "solar-eclipse", "lunar-eclipse", "ephemeris", "eclipse-prediction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.24",
  "skyfield>=1.49",
]

[project.scripts]
eclipsekit-validate = "eclipsekit.validation_framework:main"
pyeclipse-validate = "eclipsekit.validation_framework:main"
eclipsekit-validate-path = "eclipsekit.path_validation:main"
pyeclipse-validate-path = "eclipsekit.path_validation:main"
eclipsekit-validate-limb = "eclipsekit.limb_validation:main"
pyeclipse-validate-limb = "eclipsekit.limb_validation:main"
eclipsekit-validate-topography = "eclipsekit.topography_validation:main"
eclipsekit-validate-dem-format = "eclipsekit.topography_formats_validation:main"
eclipsekit-audit-lunar-frames = "eclipsekit.lunar_coordinates_validation:main"
eclipsekit-validate-dem-control = "eclipsekit.lunar_control_points:main"
eclipsekit-audit-dem-mosaic = "eclipsekit.lunar_dem_mosaic_validation:main"
eclipsekit-validate-corridor = "eclipsekit.corridor_cli:main"
eclipsekit-audit-references = "eclipsekit.reference_matrix:main"
eclipsekit-eop-audit = "eclipsekit.earth_orientation:main"
eclipsekit-validate-all = "eclipsekit.unified_validation:main"
eclipsekit-benchmark = "eclipsekit.performance:main"
eclipsekit-regression = "eclipsekit.regression:main"
eclipsekit-certify = "eclipsekit.certification:main"

[project.optional-dependencies]
limb = ["torch>=2.0"]
raster = ["rasterio>=1.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "build>=1.2", "hatchling>=1.27"]
security = ["pip-audit>=2.7"]

[tool.hatch.build.targets.sdist]
# A source archive is deliberately allow-listed. It includes the package,
# tests, docs, examples, CI workflows and only the nine small public reference
# fixtures required by the regression tests. Local DEMs, kernels, checkpoints,
# city catalogues, caches, reports and results are never traversed.
only-include = [
  "src/eclipsekit",
  "tests",
  "docs",
  "examples",
  "scripts",
  ".github/workflows",
  "data/validation/reference_cases.json",
  "data/validation/path_reference_manifest.json",
  "data/validation/global_path_2017-08-21.csv",
  "data/validation/global_path_2019-07-02.csv",
  "data/validation/global_path_2020-06-21.csv",
  "data/validation/global_path_2026-08-12.csv",
  "data/validation/global_corridor_2017_nasa.csv",
  "data/validation/besselian_1999_reference.json",
  "data/validation/besselian_1999_aug11_nasa.json",
  "pyproject.toml",
  "README.md",
  "CHANGELOG.md",
  "LICENSE.md",
  "NOTICE",
  "SECURITY.md",
  "CITATION.cff",
  "CONTRIBUTING.md",
  "MIGRATION.md",
]
exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.py[cod]",
  "**/.pytest_cache/**",
  "**/.pytest_*/**",
  "**/*.bsp",
  "**/*.pt",
  "**/*.pth",
  "**/*.ckpt",
  "**/*.IMG",
  "**/*.LBL",
  "**/*.img",
  "**/*.lbl",
  "**/*.cub",
  "**/*.jp2",
  "**/*.tif",
  "**/*.tiff",
  "**/*.npz",
  "**/*.npy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eclipsekit"]

[tool.hatch.build.targets.wheel.force-include]
"src/eclipsekit/py.typed" = "eclipsekit/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
