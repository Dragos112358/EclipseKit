name: EclipseKit CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests examples scripts
      - name: Compile
        run: python -m compileall -q src tests examples scripts
      - name: Test suite
        shell: bash
        run: |
          mkdir -p .pytest-tmp
          python -m pytest -q --basetemp="$PWD/.pytest-tmp/ci"
      - name: Build wheel
        run: python -m build --wheel
      - name: Check PEP 561 marker in wheel
        run: |
          python -c "import glob, zipfile; p=glob.glob('dist/*.whl')[0]; z=zipfile.ZipFile(p); assert 'eclipsekit/py.typed' in z.namelist(); print('PEP 561 marker: PASS')"

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and audit tool
        run: python -m pip install -e . pip-audit
      - name: Audit installed dependencies
        run: python -m pip_audit --skip-editable
