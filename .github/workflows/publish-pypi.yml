name: Publish Python package to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project, test, and security tools
        run: python -m pip install --upgrade -e ".[dev,security]" build twine

      - name: Ruff
        run: python -m ruff check src tests examples scripts

      - name: Compile
        run: python -m compileall -q src tests examples scripts

      - name: Test suite
        run: python -m pytest -q --basetemp="$PWD/.pytest-tmp/release"

      - name: Dependency vulnerability audit
        run: python -m pip_audit --skip-editable

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Enforce per-file upload size limit
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          artifacts = sorted(Path("dist").glob("*"))
          if len(artifacts) != 2:
              raise SystemExit(f"Expected wheel + sdist, found: {artifacts}")
          limit = 95_000_000  # keep safely below PyPI's default 100 MB/file limit
          for artifact in artifacts:
              size = artifact.stat().st_size
              print(f"{artifact.name}: {size:,} bytes")
              if size >= limit:
                  raise SystemExit(f"Distribution too large: {artifact.name}")
          PY

      - name: Check wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          assert "eclipsekit/py.typed" in names
          forbidden = ("tests/", "data/", "models/", "reports/", "results/")
          leaked = [name for name in names if name.startswith(forbidden)]
          assert not leaked, leaked
          print(f"Wheel contents: PASS ({len(names)} files)")
          PY

      - name: Store release distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI via Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/eclipsekit/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
